name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Um push novo na mesma branch/PR cancela a execução anterior que ainda estiver rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # O relatório de testes é publicado como um check run próprio no commit/PR.
  checks: write

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify compila, roda os testes (H2 em memória, sem banco externo) e empacota o jar.
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      # Roda mesmo se algum teste falhar (é justamente quando o relatório mais importa),
      # mas não quando a execução foi cancelada por um push mais novo.
      - name: Relatório de testes
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Relatório de testes
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          report-title: Relatório de testes
          badge-title: testes
          # Um XML por classe de teste: listar os arquivos só duplicaria as suítes.
          list-files: none
          list-suites: all
          list-tests: all
          # Quem reprova o build é o passo "Build e testes"; aqui é só relatório.
          fail-on-error: false
          # Se a compilação falhar não há XML de teste; não vale um segundo erro por isso.
          fail-on-empty: false

      - name: Anexar XMLs dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
