name: CI

on:
  push:
    branches: [dev-marcoNoronha]
  pull_request:
    branches: [main, dev-marcoNoronha]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fisiotech_test
          MYSQL_USER: fisiotech
          MYSQL_PASSWORD: fisiotech_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validar build, testes e migrações MySQL
        run: ./mvnw --batch-mode --no-transfer-progress verify
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/fisiotech_test?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_TEST_USERNAME: fisiotech
          MYSQL_TEST_PASSWORD: fisiotech_test
      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: error
      - name: Publicar aplicação
        uses: actions/upload-artifact@v4
        with:
          name: fisiotech-backend
          path: target/*.jar
          if-no-files-found: error
