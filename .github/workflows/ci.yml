name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Um push novo na mesma branch/PR cancela a execução anterior que ainda estiver rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # O relatório de testes é publicado como um check run próprio no commit/PR...
  checks: write
  # ...e como comentário no PR.
  pull-requests: write

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify compila, roda os testes (H2 em memória, sem banco externo) e empacota o jar.
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      # Roda mesmo se algum teste falhar (é justamente quando o relatório mais importa),
      # mas não quando a execução foi cancelada por um push mais novo. Publica:
      # - no resumo da execução: totais + tabela de todos os testes, agrupados por classe;
      # - um check "Relatório de testes" no commit, com anotação na linha de cada falha;
      # - em PRs, um comentário com o mesmo resumo (atualizado a cada push, não duplicado).
      - name: Relatório de testes
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Relatório de testes
          detailed_summary: true
          group_suite: true
          include_passed: true
          include_time_in_summary: true
          simplified_summary: true
          comment: ${{ github.event_name == 'pull_request' }}
          # Quem reprova o build é o passo "Build e testes"; aqui é só relatório.
          fail_on_failure: false
          # Se a compilação falhar não há XML de teste; não vale um segundo erro por isso.
          require_tests: false

      - name: Anexar XMLs dos testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
