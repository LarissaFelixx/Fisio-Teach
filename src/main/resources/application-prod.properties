spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

app.admin.nome=${ADMIN_NOME}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.jwt.private-key=${JWT_PRIVATE_KEY}

# Recuperação de senha por email. Host/porta/usuário/senha do SMTP vêm das variáveis
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
app.recuperacao-senha.remetente=${MAIL_REMETENTE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
