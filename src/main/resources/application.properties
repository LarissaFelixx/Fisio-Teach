spring.application.name=fisiotech

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.jwt.issuer=fisiotech
app.jwt.audience=fisiotech-api
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.password-recovery.ttl=15m
app.password-recovery.max-requests-per-hour=3
app.password-recovery.frontend-url=${PASSWORD_RECOVERY_URL:http://localhost:4200/redefinir-senha}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@fisiotech.local}
