spring.application.name=fisiotech

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.jwt.issuer=fisiotech
app.jwt.audience=fisiotech-api
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.recuperacao-senha.validade-minutos=15
app.recuperacao-senha.remetente=${MAIL_FROM:no-reply@fisiotech.local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,capacitor://localhost,http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.environment=${APP_ENVIRONMENT:local}
