spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/fisiotech?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:fisiotech}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.admin.nome=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_PASSWORD}
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.public-key=${JWT_PUBLIC_KEY}
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.password-recovery.frontend-url=${PASSWORD_RECOVERY_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
info.app.environment=homolog
