services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fisiotech
      MYSQL_USER: fisiotech
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    env_file: .env.homolog
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
